<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M2,2 L8,8 M8,2 L2,8" stroke="#c62828" stroke-width="2" fill="none"/></marker>
  </defs>

  <text x="20" y="30" fill="#0f172a" font-size="16" font-weight="bold">to-be · module delta — agent-bus package layering (agent-bus-layering)</text>
  <text x="20" y="50" fill="#64748b" font-size="11">green = ++ added/moved · amber = ~ modified · neutral = unchanged context · gateway.runtime ↛ eventbus.runtime enforced by ArchUnit (Q3a)</text>

  <!-- BUS outer -->
  <rect x="20" y="70" width="1080" height="560" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text x="30" y="88" fill="#0f172a" font-size="12" font-weight="bold">com.huawei.ascend.bus..   (AgentBusApplication — scan covers ALL sub-packages, incl. NEW common + eventbus.runtime)</text>

  <!-- ++ common (NEW, green) -->
  <rect x="36" y="100" width="316" height="120" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" rx="8"/>
  <text x="46" y="118" fill="#14532d" font-size="12" font-weight="bold">++ common   [CFG]   NEW package (Q2a) — shared plane config</text>
  <rect x="50" y="132" width="288" height="74" fill="#d4edda" stroke="#16a34a" stroke-width="1.8" rx="5"/>
  <text x="58" y="152" fill="#14532d" font-size="12" font-weight="bold">[CFG] AgentBusBrokerProperties</text>
  <text x="58" y="170" fill="#475569" font-size="10">@ConfigurationProperties("agent-bus")</text>
  <text x="58" y="184" fill="#475569" font-size="10">++ moved here (from gateway.runtime)</text>
  <text x="58" y="198" fill="#475569" font-size="10">SHARED — both planes depend here, not on each other</text>

  <!-- ++ eventbus.runtime (NEW, green) -->
  <rect x="368" y="100" width="340" height="260" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" rx="8"/>
  <text x="378" y="118" fill="#14532d" font-size="12" font-weight="bold">++ eventbus.runtime   [SRV]   NEW package (Q1a) — event-bus wiring</text>
  <rect x="382" y="132" width="312" height="58" fill="#d4edda" stroke="#16a34a" stroke-width="1.8" rx="5"/>
  <text x="390" y="152" fill="#14532d" font-size="12" font-weight="bold">[SRV] EventBusRelayConfiguration</text>
  <text x="390" y="170" fill="#475569" font-size="10">@Profile(eventbus) · ++ moved</text>
  <rect x="382" y="198" width="312" height="58" fill="#d4edda" stroke="#16a34a" stroke-width="1.8" rx="5"/>
  <text x="390" y="218" fill="#14532d" font-size="12" font-weight="bold">[SRV] EventBusRelaySchedulingConfig</text>
  <text x="390" y="236" fill="#475569" font-size="10">@Profile(eventbus) · ++ moved</text>
  <rect x="382" y="264" width="312" height="58" fill="#d4edda" stroke="#16a34a" stroke-width="1.8" rx="5"/>
  <text x="390" y="284" fill="#14532d" font-size="12" font-weight="bold">[SRV] RelayScheduler</text>
  <text x="390" y="302" fill="#475569" font-size="10">@PostConstruct start() · ++ moved</text>

  <!-- ~ gateway.runtime (MODIFIED, amber) -->
  <rect x="728" y="100" width="352" height="260" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" rx="8"/>
  <text x="738" y="118" fill="#7c5400" font-size="12" font-weight="bold">~ gateway.runtime   [SRV]   MODIFIED — now gateway-only (3 files; lost 4)</text>
  <rect x="742" y="132" width="324" height="58" fill="#fff3cd" stroke="#d97706" stroke-width="1.8" rx="5"/>
  <text x="750" y="152" fill="#7c5400" font-size="12" font-weight="bold">[SRV] GatewayRuntimeConfiguration</text>
  <text x="750" y="170" fill="#475569" font-size="10">@Profile(gateway) · ~ + import common.AgentBusBrokerProperties</text>
  <rect x="742" y="198" width="324" height="48" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="750" y="218" fill="#0f172a" font-size="12" font-weight="bold">[SRV] GatewayRuntimeController</text>
  <text x="750" y="236" fill="#475569" font-size="10">@RestController (unchanged)</text>
  <rect x="742" y="254" width="324" height="48" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="750" y="274" fill="#0f172a" font-size="12" font-weight="bold">[SRV] GatewayRuntimeService</text>
  <text x="750" y="292" fill="#475569" font-size="10">IngressGateway (unchanged)</text>

  <!-- forbidden edge: gateway.runtime ↛ eventbus.runtime (ArchUnit Q3a) -->
  <line x1="728" y1="160" x2="708" y2="160" stroke="#c62828" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arrX)"/>
  <text x="640" y="152" fill="#c62828" font-size="10" font-weight="bold">↛ forbidden by ArchUnit (Q3a)</text>
  <text x="620" y="166" fill="#c62828" font-size="9">gateway must not depend on eventbus.runtime</text>

  <!-- green edges: configs → common (new cross-package dep) -->
  <path d="M382,150 C360,150 340,160 338,168" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="345" y="145" fill="#16a34a" font-size="9">++ depends</text>
  <path d="M742,150 C700,150 420,165 338,180" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- forwarding + registry context (neutral) -->
  <rect x="36" y="380" width="1044" height="230" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text x="46" y="398" fill="#0f172a" font-size="12" font-weight="bold">forwarding.* + registry.runtime   (unchanged context — the moved files keep depending on these exactly as before)</text>
  <rect x="52" y="412" width="1012" height="44" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="60" y="432" fill="#0f172a" font-size="12" font-weight="bold">[PORT] forwarding.spi</text>
  <text x="60" y="449" fill="#475569" font-size="10">ForwardingInboxPort / ForwardingOutboxPort / ForwardingRouteHandle  ← gateway + eventbus both depend here (SPI, not impl)</text>
  <rect x="52" y="464" width="1012" height="44" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="60" y="484" fill="#0f172a" font-size="12" font-weight="bold">[LIB] forwarding.runtime.relay</text>
  <text x="60" y="501" fill="#475569" font-size="10">EventBusRelayWorker / RelayTick / RelayDispatchLoop</text>
  <rect x="52" y="516" width="500" height="44" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="60" y="536" fill="#0f172a" font-size="12" font-weight="bold">[PORT] forwarding.runtime.transport.broker</text>
  <text x="60" y="553" fill="#475569" font-size="10">BrokerClientProperties + RocketMq adapters</text>
  <rect x="564" y="516" width="500" height="44" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="572" y="536" fill="#0f172a" font-size="12" font-weight="bold">[DB] forwarding.runtime.persistence.jdbc</text>
  <text x="572" y="553" fill="#475569" font-size="10">JdbcForwardingInbox / JdbcForwardingOutbox</text>
  <rect x="52" y="568" width="1012" height="34" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="60" y="588" fill="#0f172a" font-size="12" font-weight="bold">[SRV] registry.runtime — registry plane wiring (unchanged)</text>

  <!-- context edges (neutral) from the two wiring packages down to forwarding.spi -->
  <path d="M538,360 C538,370 538,378 538,412" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrN)"/>
  <path d="M904,360 C904,370 540,378 538,412" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrN)"/>
  <text x="546" y="400" fill="#94a3b8" font-size="9">depend on forwarding.spi (unchanged)</text>

  <text x="20" y="648" fill="#64748b" font-size="10">legend: green ++ added/moved · amber ~ modified · white unchanged · green arrow = new cross-package dependency · red dashed ↛ = forbidden by ArchUnit · 3 files → eventbus.runtime + 1 (AgentBusBrokerProperties) → common</text>
</svg>
