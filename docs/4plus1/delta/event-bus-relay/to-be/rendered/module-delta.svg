<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <text x="20" y="30" fill="#0f172a" font-size="16" font-weight="bold">to-be · module delta — two process forms + relay (event-bus-relay)</text>
  <text x="20" y="50" fill="#64748b" font-size="11">green=++ added · amber=~ modified · red=-- legacy · module type via [tag]</text>

  <!-- GATEWAY process -->
  <rect x="30" y="70" width="500" height="310" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text x="40" y="90" fill="#0f172a" font-size="12" font-weight="bold">[++] GATEWAY process — AgentBusApplication @Profile(gateway)</text>
  <rect x="48" y="104" width="464" height="44" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="56" y="124" fill="#0f172a" font-size="12" font-weight="bold">[++] GatewayRuntimeConfiguration @Profile(gateway)</text>
  <text x="56" y="140" fill="#475569" font-size="10">wires the gateway form (was: no wiring)</text>
  <rect x="48" y="158" width="464" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="56" y="178" fill="#0f172a" font-size="12" font-weight="bold">[~] GatewayRuntimeService (now a WIRED bean)</text>
  <text x="56" y="194" fill="#475569" font-size="10">dispatchRequest produce hop1 · acceptWindow classify</text>
  <rect x="48" y="212" width="464" height="44" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="56" y="232" fill="#0f172a" font-size="12" font-weight="bold">[++] GatewayRuntimeController POST /a2a</text>
  <text x="56" y="248" fill="#475569" font-size="10">(was S4-deferred)</text>
  <rect x="48" y="266" width="464" height="44" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="56" y="286" fill="#0f172a" font-size="12" font-weight="bold">[++] gateway response consumer</text>
  <text x="56" y="302" fill="#475569" font-size="10">polls T_invocation_resp_out → classify</text>
  <text x="56" y="336" fill="#475569" font-size="10">reuses BrokerForwardingRelay/ConsumerPort + outbox substrate</text>

  <!-- EVENT-BUS+REGISTRY process -->
  <rect x="560" y="70" width="530" height="310" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text x="570" y="90" fill="#0f172a" font-size="12" font-weight="bold">[++] EVENT-BUS+REGISTRY process @Profile(eventbus)</text>
  <rect x="578" y="104" width="494" height="44" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="586" y="124" fill="#0f172a" font-size="12" font-weight="bold">[++] EventBusRelayConfiguration @Profile(eventbus)</text>
  <text x="586" y="140" fill="#475569" font-size="10">wires the relay form (was: no wiring)</text>
  <rect x="578" y="158" width="494" height="58" fill="#d4edda" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="586" y="180" fill="#0f172a" font-size="13" font-weight="bold">[++] EventBusRelayWorker + RelayLoop</text>
  <text x="586" y="198" fill="#0f172a" font-size="11">consume → govern → re-produce (CORE net-new)</text>
  <text x="586" y="212" fill="#475569" font-size="10">reuses Inbox/Outbox/Relay/Consumer ports + state machine/retry/breaker</text>
  <rect x="578" y="226" width="240" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="586" y="246" fill="#0f172a" font-size="12" font-weight="bold">[~] JdbcForwardingInbox</text>
  <text x="586" y="262" fill="#475569" font-size="10">now WIRED — dedup/govern</text>
  <rect x="830" y="226" width="242" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="838" y="246" fill="#0f172a" font-size="12" font-weight="bold">[~] JdbcForwardingOutbox</text>
  <text x="838" y="262" fill="#475569" font-size="10">now WIRED</text>
  <rect x="578" y="280" width="494" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" rx="5"/>
  <text x="586" y="305" fill="#475569" font-size="11">[·] registry plane — co-located, unchanged (controller/scheduler/discovery)</text>

  <!-- BROKER -->
  <rect x="180" y="410" width="760" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="560" y="437" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[~] RocketMQ — ALL 8 topics now USED (deliver / resp_in / resp_out wired — were provisioned-unused)</text>

  <!-- A2A legacy -->
  <rect x="180" y="470" width="760" height="44" fill="#ffe0e0" stroke="#c62828" stroke-width="1.5" rx="5"/>
  <text x="560" y="497" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[--] A2aForwardingDeliveryPort (T1 HTTP push — legacy, replaced by broker pub/sub; retained for coexistence)</text>

  <!-- DEPLOY -->
  <rect x="30" y="540" width="1060" height="170" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4" rx="8"/>
  <text x="40" y="560" fill="#0f172a" font-size="12" font-weight="bold">[++] DEPLOYMENT — to-be</text>
  <rect x="48" y="574" width="500" height="64" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="56" y="594" fill="#0f172a" font-size="12" font-weight="bold">[++] agent-bus spring-boot-maven-plugin &lt;repackage&gt;</text>
  <text x="56" y="612" fill="#475569" font-size="10">fat-jar · AgentBusApplication java -jar claim now fulfilled</text>
  <text x="56" y="628" fill="#475569" font-size="10">~ single @SpringBootApplication + @Profile selects form</text>
  <rect x="560" y="574" width="500" height="64" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="568" y="594" fill="#0f172a" font-size="12" font-weight="bold">[++] docker-compose: gateway + event-bus services</text>
  <text x="568" y="612" fill="#475569" font-size="10">SPRING_PROFILES_ACTIVE selects form · depends_on RocketMQ</text>
  <text x="568" y="628" fill="#475569" font-size="10">completes local two-process topology for the two-hop IT</text>
  <text x="40" y="668" fill="#475569" font-size="10">per-form container images (Dockerfile) = optional/deferred (Q3a scoped to fat-jar + compose services)</text>
  <text x="40" y="684" fill="#475569" font-size="10">external agent-runtime-java hop2 consumer/producer = parallel, not time-locked (cross-repo boundary only)</text>

  <!-- arrows -->
  <line x1="280" y1="148" x2="280" y2="156" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="202" x2="280" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="256" x2="280" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="148" x2="825" y2="156" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="216" x2="700" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="216" x2="950" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- GW produce hop1 -> broker -->
  <path d="M280,310 C280,360 400,392 560,410" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="330" y="372" fill="#475569" font-size="10">produce hop1 (T_invocation_req)</text>
  <!-- broker -> relay poll req -->
  <path d="M560,454 C700,454 760,360 825,216" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="640" y="400" fill="#475569" font-size="10">poll hop1 → govern</text>
  <!-- relay -> broker produce hop2 -->
  <path d="M825,216 C825,300 760,420 560,454" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="700" y="350" fill="#475569" font-size="10">produce hop2 (T_invocation_deliver)</text>
  <!-- broker -> GW consumer poll resp -->
  <path d="M400,454 C360,400 320,360 280,310" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="40" y="392" fill="#475569" font-size="10">poll resp_out</text>
</svg>
