<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <text x="20" y="30" fill="#0f172a" font-size="16" font-weight="bold">to-be · flow delta — two-hop governance relay (event-bus-relay)</text>
  <text x="20" y="50" fill="#64748b" font-size="11">green=++ added · amber=~ modified · white=existing reused · the boxed governance step closes the zero-coverage gap</text>

  <!-- main column x=40 w=380 -->
  <rect x="40" y="66" width="380" height="34" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="88" text-anchor="middle" fill="#0f172a" font-size="12">Client</text>

  <rect x="40" y="114" width="380" height="40" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="230" y="132" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[++] GatewayRuntimeController POST /a2a</text>
  <text x="230" y="146" text-anchor="middle" fill="#475569" font-size="10">(was S4-deferred)</text>

  <rect x="40" y="166" width="380" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="230" y="184" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[~] GatewayRuntimeService.dispatchRequest</text>
  <text x="230" y="200" text-anchor="middle" fill="#475569" font-size="10">enqueue gateway outbox → produce hop1</text>

  <rect x="40" y="222" width="380" height="34" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="230" y="244" text-anchor="middle" fill="#0f172a" font-size="12">relay.produce → broker T_invocation_req</text>

  <rect x="40" y="268" width="380" height="40" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="230" y="286" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[++] EventBusRelayWorker: poll T_invocation_req</text>
  <text x="230" y="300" text-anchor="middle" fill="#475569" font-size="10">(NEW consumer — none existed in as-is)</text>

  <!-- prominent governance box -->
  <rect x="40" y="320" width="380" height="74" fill="#d4edda" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="230" y="342" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">[++] GOVERNANCE between hops</text>
  <text x="230" y="360" text-anchor="middle" fill="#0f172a" font-size="11">Inbox dedup (ON CONFLICT) + tenant check</text>
  <text x="230" y="376" text-anchor="middle" fill="#0f172a" font-size="11">+ correlation match + audit (non-byte-transparent)</text>
  <text x="230" y="389" text-anchor="middle" fill="#475569" font-size="9">L2 §1.2/§4.1 · as-is: zero coverage</text>

  <rect x="40" y="406" width="380" height="40" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="230" y="424" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[++] re-publish: outbox enqueue → relay.produce</text>
  <text x="230" y="438" text-anchor="middle" fill="#475569" font-size="10">→ broker T_invocation_deliver (was unused)</text>

  <rect x="40" y="458" width="380" height="44" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="230" y="476" text-anchor="middle" fill="#0f172a" font-size="12">TestAgentRuntime (in-repo double) / external runtime</text>
  <text x="230" y="492" text-anchor="middle" fill="#475569" font-size="10">poll T_invocation_deliver</text>

  <rect x="40" y="514" width="380" height="34" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="230" y="536" text-anchor="middle" fill="#0f172a" font-size="12">produce response → T_invocation_resp_in</text>

  <rect x="40" y="560" width="380" height="44" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="230" y="578" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[++] EventBusRelayWorker: poll T_invocation_resp_in</text>
  <text x="230" y="594" text-anchor="middle" fill="#475569" font-size="10">+ governance (dedup / corr / audit)</text>

  <rect x="40" y="616" width="380" height="34" fill="#d4edda" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="230" y="638" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[++] re-publish → T_invocation_resp_out</text>

  <rect x="40" y="662" width="380" height="44" fill="#fff3cd" stroke="#d97706" stroke-width="1.5" rx="5"/>
  <text x="230" y="680" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">[~] GatewayRuntimeService.acceptWindow</text>
  <text x="230" y="696" text-anchor="middle" fill="#475569" font-size="10">poll T_invocation_resp_out → classify</text>

  <rect x="40" y="718" width="380" height="34" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="230" y="740" text-anchor="middle" fill="#0f172a" font-size="12">return IngressResponse</text>

  <!-- right-side hop annotations -->
  <text x="450" y="244" fill="#94a3b8" font-size="10">hop1 (gateway→broker)</text>
  <text x="450" y="430" fill="#94a3b8" font-size="10">hop2 (event-bus→broker)</text>
  <text x="450" y="536" fill="#94a3b8" font-size="10">resp hop1 (runtime→broker)</text>
  <text x="450" y="638" fill="#94a3b8" font-size="10">resp hop2 (event-bus→broker)</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6">
    <line x1="230" y1="100" x2="230" y2="112" marker-end="url(#arr)"/>
    <line x1="230" y1="154" x2="230" y2="164" marker-end="url(#arr)"/>
    <line x1="230" y1="210" x2="230" y2="220" marker-end="url(#arr)"/>
    <line x1="230" y1="256" x2="230" y2="266" marker-end="url(#arr)"/>
    <line x1="230" y1="308" x2="230" y2="318" marker-end="url(#arr)"/>
    <line x1="230" y1="394" x2="230" y2="404" marker-end="url(#arr)"/>
    <line x1="230" y1="446" x2="230" y2="456" marker-end="url(#arr)"/>
    <line x1="230" y1="502" x2="230" y2="512" marker-end="url(#arr)"/>
    <line x1="230" y1="548" x2="230" y2="558" marker-end="url(#arr)"/>
    <line x1="230" y1="604" x2="230" y2="614" marker-end="url(#arr)"/>
    <line x1="230" y1="650" x2="230" y2="660" marker-end="url(#arr)"/>
    <line x1="230" y1="706" x2="230" y2="716" marker-end="url(#arr)"/>
  </g>
  <text x="240" y="780" fill="#475569" font-size="11">net-new reuses ALL substrate ports (Inbox/Outbox/Relay/Consumer + state machine/retry/breaker) — no new ports.</text>
  <text x="240" y="798" fill="#475569" font-size="11">governance-between-hops (boxed) = the L2-core semantics that as-is left unverified — now the exercised core.</text>
</svg>
