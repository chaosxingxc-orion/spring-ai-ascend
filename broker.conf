# broker.conf — RocketMQ broker config for agent-bus (decision packet §7 slice 4).
#
# Mounted read-only into the apache/rocketmq:5.3.1 broker container and loaded via
# `mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf` (see docker-compose.yml
# rocketmq-broker service).
#
# The identity fields mirror the image's default broker.conf so the broker still registers
# as DefaultCluster — rocketmq-init creates the 8 L2-mandated topics there
# (ascend_bus_invocation_* / ascend_bus_a2a_*). namesrvAddr is supplied via the
# NAMESRV_ADDR env var in the compose (not duplicated here).
#
# Authority: docs/architecture/l0/10-governance/review-packets/
# agent-bus-broker-filtering-spi-completion-decision.md §7 (slice 4 / row1).
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# brokerIP1 — the address the broker advertises to nameserver, which clients
# (running on the Windows host in the E2E setup) then use to connect. Without
# this, the broker registers its Docker-internal IP (e.g. 172.18.0.3), which is
# unreachable from the Windows host and causes
# "connect to 172.18.0.3:10911 failed" at consumer subscribe time.
# 127.0.0.1 works because WSL2 forwards localhost ports to the Windows host.
brokerIP1=127.0.0.1

# Slice 4: enable SQL92 property filtering so MessageSelector.bySql — the adapter's
# DeliveryFilter->SQL92 translation (slice 2 / RocketMqBrokerForwardingConsumer.sql92Expression)
# — is enforced BROKER-SIDE. Without this the broker ignores bySql and delivers messages
# regardless of the filter, silently degrading to client-side filtering (slice 6 D9 verifies
# a runtime pulling 0 for a msg targeted elsewhere => the filter is broker-side effective).
enablePropertyFilter=true
